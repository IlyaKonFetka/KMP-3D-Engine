# ============================================================
# render.cfg — настройки рендеринга
# ============================================================
#
# render_width / render_height
#   Фактическое разрешение кадра — НЕЗАВИСИМО от размера окна.
#   Сцена всегда рендерится в это разрешение,
#   затем результат масштабируется на окно.
#
#   Примеры:
#     640 × 360   — очень низкое, но огромный FPS
#     1280 × 720  — HD (рекомендуется для начала)
#     1920 × 1080 — Full HD
#     2560 × 1440 — 2K
#
# scale_mode
#   letterbox  — сохраняет соотношение сторон, чёрные полосы
#                если окно другого AR (как в кино)
#   stretch    — растягивает на всё окно без сохранения AR
#
# window_width / window_height
#   Начальный размер окна в пикселях.
#
# ============================================================

window_width   2000
window_height  1200

render_width   1280
render_height   720
scale_mode     letterbox
