# ─── Player model — visual parts ─────────────────────────────────────────────
#
# Each "part" line defines one piece of the character mesh:
#
#   part <mesh_file>  lx ly lz   sx sy sz   ar ag ab   dr dg db   sr sg sb   shine
#
#   mesh_file : file under meshes/
#   lx ly lz  : local offset from player feet BEFORE yaw rotation (metres)
#   sx sy sz  : non-uniform scale applied to the mesh
#   ar ag ab  : ambient  colour  [0..1]
#   dr dg db  : diffuse  colour  [0..1]
#   sr sg sb  : specular colour  [0..1]
#   shine     : specular exponent
#
# ─────────────────────────────────────────────────────────────────────────────

# chassis — flat steel platform, bottom flush with player feet
part box.mesh   0.00  0.00  0.00   0.58 0.20 0.46   0.10 0.10 0.12   0.45 0.45 0.52   0.80 0.80 0.80   48.0

# body — vertical blue-steel block sitting on the chassis
part box.mesh   0.00  0.20  0.00   0.28 0.62 0.24   0.08 0.10 0.15   0.28 0.40 0.62   0.70 0.70 0.70   64.0

# wheels — cylinders (axis along local-X, radius 0.15, half-width 0.10)
# order: front-left, front-right, back-left, back-right
part wheel.mesh  -0.30  0.15  0.20   1.00 1.00 1.00   0.03 0.03 0.03   0.12 0.12 0.12   0.25 0.25 0.25    8.0
part wheel.mesh   0.30  0.15  0.20   1.00 1.00 1.00   0.03 0.03 0.03   0.12 0.12 0.12   0.25 0.25 0.25    8.0
part wheel.mesh  -0.30  0.15 -0.20   1.00 1.00 1.00   0.03 0.03 0.03   0.12 0.12 0.12   0.25 0.25 0.25    8.0
part wheel.mesh   0.30  0.15 -0.20   1.00 1.00 1.00   0.03 0.03 0.03   0.12 0.12 0.12   0.25 0.25 0.25    8.0
